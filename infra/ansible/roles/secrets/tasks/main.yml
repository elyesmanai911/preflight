---
# The VM reads Key Vault with its own managed identity: no credentials on this machine or in
# this repo. Values reach Kubernetes over stdin; no_log keeps them out of Ansible's output.
- name: Get a Key Vault token from the VM's managed identity
  ansible.builtin.uri:
    url: "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net"
    headers:
      Metadata: "true"
  register: secrets_token
  no_log: true

- name: Read the secrets from Key Vault
  ansible.builtin.uri:
    url: "https://{{ secrets_vault_name }}.vault.azure.net/secrets/{{ item.name }}?api-version=7.4"
    headers:
      Authorization: "Bearer {{ secrets_token.json.access_token }}"
  register: secrets_values
  # The VM's read permission is granted just after the VM exists and can take minutes to apply.
  until: secrets_values.status == 200
  retries: 30
  delay: 10
  loop: "{{ secrets_items }}"
  no_log: true

- name: Store them as Kubernetes secrets
  ansible.builtin.command:
    cmd: k3s kubectl apply -f -
    stdin: >-
      {{ {'apiVersion': 'v1', 'kind': 'Secret',
          'metadata': {'name': item.item.name, 'namespace': secrets_namespace},
          'stringData': {item.item.key: item.json.value}} | to_json }}
  register: secrets_applied
  changed_when: "' unchanged' not in secrets_applied.stdout"
  loop: "{{ secrets_values.results }}"
  no_log: true
