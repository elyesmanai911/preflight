---
# The pinned binary from the GitHub release, checked against the release's own checksum file.
# No `curl | sh`: what runs is exactly what this file says.
- name: Install the k3s binary
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/k3s"
    checksum: "sha256:https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/sha256sum-amd64.txt"
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: "0755"
  notify: Restart k3s

- name: Link kubectl, crictl and ctr to k3s
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: [kubectl, crictl, ctr]

- name: Install the k3s service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Start k3s at boot and now
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Apply a new binary or unit before checking the node
  ansible.builtin.meta: flush_handlers

- name: Wait for the node to be Ready
  block:
    - name: Wait for the node to be Ready
      ansible.builtin.command: k3s kubectl wait node --all --for=condition=Ready --timeout=10s
      register: k3s_node_ready
      until: k3s_node_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false
  rescue:
    # Show why, instead of only "connection refused".
    - name: Read k3s's last log lines
      ansible.builtin.command: journalctl -u k3s --no-pager -n 60
      register: k3s_journal
      changed_when: false

    - name: Fail with k3s's own error
      ansible.builtin.fail:
        msg: "{{ k3s_journal.stdout_lines }}"
