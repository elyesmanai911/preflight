---
# The whole site.yml (hardening + k3s + platform) on one container standing in for the VM.
driver:
  name: docker
platforms:
  - name: preflight-vm
    groups: [demo]
    image: preflight-molecule-ubuntu:24.04
    dockerfile: ../../roles/hardening/molecule/default/Dockerfile
    pre_build_image: false
    privileged: true # systemd, ufw and k3s need it; the container keeps its own network
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # containerd can't run its overlay snapshotter on Docker's overlay filesystem.
      - /var/lib/rancher/k3s
    command: /lib/systemd/systemd
provisioner:
  name: ansible
  playbooks:
    prepare: ../../roles/hardening/molecule/default/prepare.yml
  inventory:
    host_vars:
      preflight-vm:
        # A made-up public IP, to prove the ApplicationSet gets the VM's domain.
        platform_preview_domain: preview.203.0.113.10.nip.io
verifier:
  name: ansible
