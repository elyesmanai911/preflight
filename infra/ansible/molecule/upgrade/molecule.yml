---
# Day-2 upgrade: start on the previous minor version, upgrade with the real playbook.
driver:
  name: docker
platforms:
  - name: preflight-vm
    groups: [demo]
    image: preflight-molecule-ubuntu:24.04
    dockerfile: ../../roles/hardening/molecule/default/Dockerfile
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/rancher/k3s # containerd can't use overlay on Docker's overlay filesystem
    command: /lib/systemd/systemd
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
verifier:
  name: ansible
