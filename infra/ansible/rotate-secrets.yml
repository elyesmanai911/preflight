---
# Day 2: rotate the GitHub token or the LLM key, without rebuilding the VM.
#   1. Put the new value in Key Vault (Terraform owns it, so it doesn't drift back):
#        cd infra/demo && TF_VAR_github_token=... TF_VAR_llm_api_key=... terraform apply
#   2. ansible-playbook -i inventory/demo.yml rotate-secrets.yml
# The triage CronJob reads its secrets when each run starts, so the next run uses the new ones.
- name: Rotate secrets
  hosts: demo
  become: true
  vars:
    rotate_github_repo: elyesmanai911/preflight
    rotate_llm_base_url: https://generativelanguage.googleapis.com/v1beta/openai
  roles:
    - secrets
  post_tasks:
    # Prove the new values work, instead of finding out from a failed triage run later.
    - name: The GitHub token can read the repo
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ rotate_github_repo }}"
        headers:
          Authorization: "Bearer {{ (secrets_values.results | selectattr('item.name', '==', 'github-token') | first).json.value }}"
          Accept: application/vnd.github+json
      no_log: true

    - name: The LLM key is accepted
      ansible.builtin.uri:
        url: "{{ rotate_llm_base_url }}/models"
        headers:
          Authorization: "Bearer {{ (secrets_values.results | selectattr('item.name', '==', 'llm-api-key') | first).json.value }}"
      no_log: true
