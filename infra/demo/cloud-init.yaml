#cloud-config
# Boots a bare Ubuntu VM into the full Preflight platform, with no manual steps:
# k3s, then (via k3s's built-in Helm controller and auto-applied manifests) Argo CD, the preview
# ApplicationSet, monitoring and the triage watcher. Secrets come from Key Vault at boot.
write_files:
  # Anything in this directory is applied by k3s automatically (and retried until CRDs exist).
  - path: /var/lib/rancher/k3s/server/manifests/argocd.yaml
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: argocd
        namespace: kube-system
      spec:
        repo: https://argoproj.github.io/argo-helm
        chart: argo-cd
        version: 10.11.6
        targetNamespace: argocd
        createNamespace: true
        valuesContent: |-
          ${indent(10, argocd_values)}
  - path: /var/lib/rancher/k3s/server/manifests/preview-appset.yaml
    content: |
      ${indent(6, appset)}
  - path: /var/lib/rancher/k3s/server/manifests/platform-apps.yaml
    content: |
      ${indent(6, platform_apps)}
  - path: /var/lib/rancher/k3s/server/manifests/preflight-system.yaml
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: preflight-system
  # Reads the secrets with the VM's managed identity and stores them as Kubernetes secrets.
  # Values go through stdin, never through command-line arguments or files.
  - path: /opt/preflight/secrets.py
    permissions: "0700"
    content: |
      import json, subprocess, time, urllib.parse, urllib.request

      VAULT = "${vault}"
      SECRETS = [("github-token", "token"), ("llm-api-key", "key")]

      def get_json(url, headers):
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as r:
              return json.load(r)

      def read_secret(name):
          resource = urllib.parse.quote("https://vault.azure.net", safe="")
          token = get_json(
              "http://169.254.169.254/metadata/identity/oauth2/token"
              "?api-version=2018-02-01&resource=" + resource,
              {"Metadata": "true"},
          )["access_token"]
          url = "https://" + VAULT + ".vault.azure.net/secrets/" + name + "?api-version=7.4"
          return get_json(url, {"Authorization": "Bearer " + token})["value"]

      for name, key in SECRETS:
          for attempt in range(90):  # the VM's Key Vault role is granted after the VM exists
              try:
                  value = read_secret(name)
                  break
              except Exception as error:
                  print(name, "not readable yet:", type(error).__name__, flush=True)
                  time.sleep(10)
          else:
              raise SystemExit("gave up reading " + name)
          secret = {
              "apiVersion": "v1",
              "kind": "Secret",
              "metadata": {"name": name, "namespace": "preflight-system"},
              "stringData": {key: value},
          }
          for attempt in range(60):  # wait for k3s and the namespace
              if subprocess.run(["k3s", "kubectl", "apply", "-f", "-"],
                                input=json.dumps(secret).encode()).returncode == 0:
                  break
              time.sleep(5)
          print(name, "stored", flush=True)
runcmd:
  - curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="${k3s_version}" sh -
  - python3 /opt/preflight/secrets.py
