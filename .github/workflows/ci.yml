name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as the Docker image
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest -q

      - name: Train model + quality gate
        run: |
          python -m ml.train
          { echo "### Model metrics"; echo '```json'; cat model/metrics.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: model/metrics.json

  terraform:
    # Static checks on the Azure code. Nothing here talks to Azure: no credentials needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: Format, validate, lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads the azurerm ruleset
        run: |
          # infra/demo reads the SSH public key at plan time; validate needs a file there.
          mkdir -p ~/.ssh && ssh-keygen -t ed25519 -N "" -q -f ~/.ssh/preflight_azure
          tflint --init -c "$PWD/infra/.tflint.hcl"
          for dir in infra/demo infra/guard; do
            echo "::group::$dir"
            terraform -chdir="$dir" fmt -check -diff
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            tflint --chdir="$dir" -c "$PWD/infra/.tflint.hcl" --minimum-failure-severity=warning
            echo "::endgroup::"
          done

      - name: Checkov (security misconfigurations)
        run: |
          pipx run --spec checkov==3.4.11 checkov -d infra/demo -d infra/guard --framework terraform --compact --quiet

  infracost:
    # Monthly cost of the Azure code, before vs after the PR, posted as a PR comment.
    # Skips itself until the INFRACOST_API_KEY repo secret exists (free key: infracost.io).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - name: No API key yet
        if: env.INFRACOST_API_KEY == ''
        run: echo "::notice::INFRACOST_API_KEY is not set; skipping the cost estimate."

      - uses: actions/checkout@v4
        if: env.INFRACOST_API_KEY != ''
        with:
          path: head

      - uses: actions/checkout@v4
        if: env.INFRACOST_API_KEY != ''
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - uses: infracost/actions/diff@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        if: env.INFRACOST_API_KEY != ''
        with:
          api-key: ${{ env.INFRACOST_API_KEY }}
          version: 2.1.6
          base-path: base
          head-path: head

  ansible:
    # Lints the VM configuration and tests each role in a throwaway Ubuntu 24.04 container.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # ansible-core 2.22 needs >= 3.13

      - name: Install Ansible tools
        run: |
          pip install ansible-core==2.22.0 ansible-lint==26.11.1 molecule==26.11.1 "molecule-plugins[docker]==26.11.0"
          ansible-galaxy collection install -r requirements.yml -p collections

      - name: Lint
        run: ansible-lint

      - name: Molecule (hardening)
        working-directory: infra/ansible/roles/hardening
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/infra/ansible/collections
          PY_COLORS: "1"
        run: molecule test

      - name: Molecule (whole site.yml)
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/infra/ansible/collections
          PY_COLORS: "1"
        run: molecule test -s site

      - name: Molecule (k3s upgrade, day 2)
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/infra/ansible/collections
          PY_COLORS: "1"
        run: molecule test -s upgrade

  label-preview:
    # Every push to a PR (re)starts its preview's 48 h TTL by adding the `preview` label.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add the preview label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
            -f "labels[]=preview" --silent

  triage-image:
    # The in-cluster triage watcher; the CronJob runs the :main tag.
    if: github.event_name == 'push'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless Cosign signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/preflight-triage
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          docker build -f agent/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .
          docker push --all-tags "$IMAGE"
          echo "DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:main")" >> "$GITHUB_ENV"

      - name: SBOM with Syft
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ env.DIGEST_REF }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: triage-sbom.spdx.json

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign the image and attach the SBOM
        run: |
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$DIGEST_REF"

  image:
    needs: lint-and-test # only build images from code that passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      security-events: write # upload Trivy results to the Security tab
      pull-requests: write # post the Preflight report comment
      actions: read # download main's model metrics (the baseline)
      id-token: write # keyless Cosign signing
    env:
      # On PRs, github.sha is a temporary merge commit; tag with the PR's head commit,
      # which is what the Argo CD ApplicationSet deploys.
      IMAGE: ghcr.io/${{ github.repository_owner }}/preflight-app:${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")" >> "$GITHUB_ENV"

      # Supply chain: an SBOM (the list of everything inside the image), then a keyless Cosign
      # signature and a signed SBOM attestation. The cluster's Kyverno policy refuses images
      # without both (platform/supply-chain/).
      - name: SBOM with Syft
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ env.DIGEST_REF }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: app-sbom.spdx.json

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Sign the image and attach the SBOM
        run: |
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$DIGEST_REF"

      # Third-party actions are pinned to a commit SHA, not a tag: tags can be moved.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy.sarif

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif

      # ---- Preflight report (PRs only) ----
      - name: Scan image with Trivy (JSON for the agent)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy.json

      - name: Get this PR's model metrics
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: model-metrics
          path: pr-metrics

      - name: Get main's model metrics and the PR diff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run_id" --repo "${{ github.repository }}" -n model-metrics -D baseline \
            || echo "No baseline metrics on main yet"
          gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" > pr.diff

      - name: Write and post the Preflight report
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-flash-latest' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Which cluster serves previews: the local k3d one by default, the Azure demo when set.
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'preview.127.0.0.1.nip.io:8080' }}
        run: |
          python3 -m agent.review --diff pr.diff --trivy trivy.json \
            --metrics pr-metrics/metrics.json --baseline baseline/metrics.json \
            --preview-url "http://pr-$PR.$PREVIEW_DOMAIN" \
            --image "$IMAGE" \
            --cpu-request "$(yq '.resources.requests.cpu' charts/preflight-app/values.yaml)" \
            --memory-request "$(yq '.resources.requests.memory' charts/preflight-app/values.yaml)" \
            > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "${{ github.repository }}" --edit-last --create-if-none --body-file comment.md
