name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as the Docker image
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest -q

      - name: Train model + quality gate
        run: |
          python -m ml.train
          { echo "### Model metrics"; echo '```json'; cat model/metrics.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: model/metrics.json

  triage-image:
    # The in-cluster triage watcher; the CronJob runs the :main tag.
    if: github.event_name == 'push'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/preflight-triage
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          docker build -f agent/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .
          docker push --all-tags "$IMAGE"

  image:
    needs: lint-and-test # only build images from code that passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      security-events: write # upload Trivy results to the Security tab
      pull-requests: write # post the Preflight report comment
      actions: read # download main's model metrics (the baseline)
    env:
      # On PRs, github.sha is a temporary merge commit; tag with the PR's head commit,
      # which is what the Argo CD ApplicationSet deploys.
      IMAGE: ghcr.io/${{ github.repository_owner }}/preflight-app:${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Third-party actions are pinned to a commit SHA, not a tag: tags can be moved.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy.sarif

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif

      # ---- Preflight report (PRs only) ----
      - name: Scan image with Trivy (JSON for the agent)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy.json

      - name: Get this PR's model metrics
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: model-metrics
          path: pr-metrics

      - name: Get main's model metrics and the PR diff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run_id" --repo "${{ github.repository }}" -n model-metrics -D baseline \
            || echo "No baseline metrics on main yet"
          gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" > pr.diff

      - name: Write and post the Preflight report
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-flash-latest' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          python3 -m agent.review --diff pr.diff --trivy trivy.json \
            --metrics pr-metrics/metrics.json --baseline baseline/metrics.json \
            --preview-url "http://pr-$PR.preview.127.0.0.1.nip.io:8080 (local k3d cluster)" \
            --image "$IMAGE" > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "${{ github.repository }}" --edit-last --create-if-none --body-file comment.md
